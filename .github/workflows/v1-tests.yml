name: V1 foundation tests
on:
  push:
    branches: [plus]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-v1.txt
      - name: Syntax and isolated tests
        run: |
          set -euo pipefail
          python -m py_compile auth.py
          python -m unittest discover -s tests -p 'test_*v1.py' -v
          git diff --exit-code -- panel.py install.sh update.sh node-panel.service
          test "$(git hash-object panel.py)" = 45be400e2e0cc1716b7fa99506c3868bd854498a
