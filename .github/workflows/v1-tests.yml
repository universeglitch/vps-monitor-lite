name: V1 foundation tests
on:
  push:
    branches: [plus]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-v1.txt
      - name: Syntax and isolated tests
        run: |
          set -euo pipefail
          python -m py_compile auth.py function.py active.py main.py panel.py
          python -m unittest discover -s tests -p 'test_*v1.py' -v
          python -O -m unittest discover -s tests -p 'test_*v1.py' -v
          git diff --exit-code -- install.sh update.sh node-panel.service
          test "$(git hash-object install.sh)" = a1d082d50625d6899371f33bc85d74da09bf6ded
          test "$(git hash-object update.sh)" = 19b6416cabb7d25f602aaa4481abf9ee94ed1504
          test "$(git hash-object node-panel.service)" = 8a4ff96d012f1dd32ce6a64bcf2c4c6df862b4b5
