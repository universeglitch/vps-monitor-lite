name: Apply and test installer safety fixes once
on:
  push:
    branches: [trae/agent-gteadp-install-safety]
    paths: [.github/workflows/install-safety-fixes-once.yml]
permissions:
  contents: write
concurrency:
  group: install-safety-fixes-once
  cancel-in-progress: false
jobs:
  fix-and-test:
    if: github.ref == 'refs/heads/trae/agent-gteadp-install-safety'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply exact targeted fixes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = ae0783913634519ff4bff61560eccd7c92813141
          test "$(git rev-parse HEAD:install.sh)" = f99087e2e2087d2ab418e8a49ec854ce36753c09
          python3 - <<'PATCH'
          from pathlib import Path
          import subprocess
          p = Path('install.sh')
          original = p.read_text()
          s = original.replace('install-dual.sh', 'install.sh')
          def once(old, new):
              global s
              assert s.count(old) == 1, 'Patch context not unique: ' + old[:70]
              s = s.replace(old, new, 1)
          once('ps -u xray -o pid= 2>/dev/null', "ps -e -o user:256= -o pid= 2>/dev/null |\n      awk '$1 == \"xray\" { print $2 }'")
          marker = '  # 原子替换（-T 保证目标是文件/符号链接时不会误判为目录移动）'
          once(marker, '''  # 普通文件的数据先落盘，再发布目录项；符号链接不得跟随其目标同步。
            if [[ -f "$tmp" && ! -L "$tmp" ]]; then
              if ! fsync_path "$tmp"; then
                red "恢复失败：无法持久化临时文件数据：$tmp"
                rm -f -- "$tmp" 2>/dev/null || true
                return 1
              fi
            fi
          
          ''' + marker)
          start = s.index('python3 - "$XRAY_CONFIG"')
          end = s.index('\nPY\n', start) + len('\nPY\n')
          block = s[start:end]
          assert block.count('"$REALITY_PORT" "$REALITY_UUID" "$REALITY_PRIVATE_KEY"') == 1
          block = block.replace('"$REALITY_PORT" "$REALITY_UUID" "$REALITY_PRIVATE_KEY"', '"$REALITY_PORT" "$REALITY_UUID"')
          assert block.count("<<'PY'") == 1
          block = block.replace("<<'PY'", "3<<<\"$REALITY_PRIVATE_KEY\" <<'PY'", 1)
          block = block.replace('import json, sys\n', 'import json, os, sys\n', 1)
          assert block.count('reality_port, reality_uuid, private_key,') == 1
          block = block.replace('reality_port, reality_uuid, private_key,', 'reality_port, reality_uuid,', 1)
          needle = ') = sys.argv[1:]\n'
          assert block.count(needle) == 1
          block = block.replace(needle, needle + '\n# 专用 FD 传递私钥，不放入进程参数或环境变量。\nwith os.fdopen(3, "r") as key_input:\n    private_key = key_input.read().rstrip("\\n")\n', 1)
          s = s[:start] + block + s[end:]
          for name in ('PANEL_URL', 'XRAY_INSTALL'):
              assert [l for l in s.splitlines() if l.startswith(name+'=')] == [l for l in original.splitlines() if l.startswith(name+'=')]
          assert '"xver": 0' in s
          assert 'install-dual.sh' not in s
          p.write_text(s)
          runner = Path('tests/run-recovery-tests.sh')
          t = runner.read_text()
          anchor = 'source "$ROOT/tests/recovery-boundary-tests.sh" || exit 2'
          assert t.count(anchor) == 1
          t = t.replace(anchor, anchor+'\n# shellcheck disable=SC1091\nsource "$ROOT/tests/install-safety-regression-tests.sh" || exit 2')
          anchor = 'run_test test_boundary_journal_and_post\n'
          assert t.count(anchor) == 1
          t = t.replace(anchor, anchor + '\n'.join('run_test '+n for n in ('test_safety_process_snapshot','test_safety_file_sync_order','test_safety_symlink_sync','test_safety_private_key_fd','test_safety_help_and_sources'))+'\n')
          runner.write_text(t)
          for f in ('update.sh','panel_dual.py','tests/recovery-boundary-tests.sh'):
              assert Path(f).read_bytes() == subprocess.check_output(['git','show','HEAD:'+f])
          print('Four targeted fixes applied; download URLs and other protected files unchanged')
          PATCH
      - name: Per-file syntax and full mock tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/installer-safety-evidence"
          E="$RUNNER_TEMP/installer-safety-evidence"
          for f in install.sh tests/run-recovery-tests.sh tests/recovery-boundary-tests.sh tests/install-safety-regression-tests.sh; do
            echo "Checking: $f"
            bash -n "$f"
          done | tee "$E/syntax.log"
          git diff --check
          bash tests/run-recovery-tests.sh > "$E/user.log" 2>&1
          cat "$E/user.log"
          sudo -n bash tests/run-recovery-tests.sh > "$E/root.log" 2>&1
          cat "$E/root.log"
          python3 - "$E" <<'VERIFY'
          import pathlib,re,sys
          e=pathlib.Path(sys.argv[1])
          for kind in ('user','root'):
              s=re.sub(r'\x1b\[[0-9;]*m','',(e/(kind+'.log')).read_text())
              assert not re.search(r'^  FAIL ',s,re.M)
              assert len(re.findall(r'^T\d',s,re.M)) == 48
              for n in range(44,49):
                  assert re.search(r'^T'+str(n)+r' ',s,re.M)
              assert '结果：' in s
              if kind=='root': assert '跳过（' not in s
          VERIFY
      - name: Upload complete test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installer-safety-evidence
          path: ${{ runner.temp }}/installer-safety-evidence/
          if-no-files-found: warn
      - name: Commit verified fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/install-safety-fixes-once.yml
          git add install.sh tests/run-recovery-tests.sh
          git diff --cached --check
          python3 - <<'VERIFY'
          import subprocess
          base='ae0783913634519ff4bff61560eccd7c92813141'
          old={l.split('\t')[1]:l.split('\t')[0] for l in subprocess.check_output(['git','ls-tree','-r',base],text=True).splitlines()}
          cur={l.split('\t')[1]:l.split('\t')[0] for l in subprocess.check_output(['git','ls-files','-s'],text=True).splitlines()}
          changed={'install.sh','tests/run-recovery-tests.sh','tests/install-safety-regression-tests.sh'}
          assert cur.keys()==old.keys() | {'tests/install-safety-regression-tests.sh'}
          for f in old:
              if f not in changed:
                  mode,typ,blob=old[f].split()
                  assert cur[f].split()[:2]==[mode,blob], f
          print('Final tree scope verified')
          VERIFY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: harden account recovery, file durability and private key transport'
          git push origin HEAD:refs/heads/trae/agent-gteadp-install-safety
          {
            echo '## Verified installer safety fixes'
            echo "Commit: $(git rev-parse HEAD)"
            sha256sum install.sh
            sed -r 's/\x1B\[[0-9;]*m//g' "$RUNNER_TEMP/installer-safety-evidence/user.log" | tail -1
            sed -r 's/\x1B\[[0-9;]*m//g' "$RUNNER_TEMP/installer-safety-evidence/root.log" | tail -1
          } >> "$GITHUB_STEP_SUMMARY"
